# Full example for api.aslilearn.ai on DigitalOcean
# After editing: sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: Long AI batches (book + AI generator) must NOT use the default
# 60s nginx proxy_read_timeout. Paste the two `location ^~` blocks below into
# the ACTIVE https server { } for api.aslilearn.ai (often managed by Certbot).
#
#   sudo nano /etc/nginx/sites-enabled/default   # or your api site file
#   sudo nginx -t && sudo systemctl reload nginx
#
# Backend: Node on 127.0.0.1:5000 (PM2 asli-api).
# ---------------------------------------------------------------

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.aslilearn.ai;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS API + Express static /uploads
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.aslilearn.ai;

    # Match multer limit in routes/superAdmin.js (100MB)
    client_max_body_size 100M;
    client_body_timeout 600s;

    # Defaults for normal API traffic
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;

    # SSL — Certbot manages on the live host, e.g.:
    # ssl_certificate /etc/letsencrypt/live/api.aslilearn.ai/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.aslilearn.ai/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Long-running AI batch kickoff (must be BEFORE location / ; ^~ wins over regex)
    location ^~ /api/book-generator/generate-batch {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location ^~ /api/ai-generator/generate-batch {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Exam PDF extraction can also run many minutes
    location ^~ /api/super-admin/exams {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_connect_timeout 60s;
        proxy_send_timeout 1800s;
        proxy_read_timeout 1800s;
        send_timeout 1800s;
        client_max_body_size 100M;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
